<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>每日学习打卡</title>
<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --ink:#1d2130;
  --muted:#8a90a6;
  --line:#eceef6;
  --purple:#7c5cff;
  --purple-2:#9d83ff;
  --purple-soft:#f0ebff;
  --green:#1fb873;
  --green-soft:#e6f7ef;
  --red:#ef4444;
  --red-soft:#fdecec;
  --amber:#f5a623;
  --amber-soft:#fdf3e0;
  --radius:16px;
  --shadow:0 6px 24px rgba(31,36,60,.06);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select{font-family:inherit;color:inherit}

.app{display:flex;min-height:100vh}
.sidebar{width:210px;flex:0 0 210px;background:var(--card);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.logo .badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--purple-2));display:flex;align-items:center;justify-content:center;color:#fff}
.logo h1{font-size:17px;margin:0;font-weight:700}
.logo p{margin:0;font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;color:var(--muted);font-size:14px;font-weight:600;transition:.15s;background:none;border:none}
.nav button svg{flex:0 0 auto}
.nav button:hover{background:var(--purple-soft);color:var(--purple)}
.nav button.active{background:linear-gradient(135deg,var(--purple),var(--purple-2));color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.25)}
.side-foot{margin-top:auto;padding:12px 8px;font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;padding:26px 30px 90px;max-width:900px;margin:0 auto}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title h2{margin:0;font-size:22px;font-weight:700}
.page-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:10px;align-items:center}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line);margin-bottom:18px}
.card-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}

.date-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.date-nav button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.date-nav button:hover{background:var(--purple-soft);color:var(--purple);border-color:#d9ceff}
.date-nav .center{text-align:center;flex:1}
.date-nav .center .big{font-size:18px;font-weight:700}
.date-nav .center .small{font-size:12px;color:var(--muted);margin-top:2px}

.progress-card{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,var(--purple),var(--purple-2));color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(124,92,255,.25)}
.progress-card .ring{position:relative;width:80px;height:80px;flex:0 0 auto}
.progress-card .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.progress-card .ring .pct b{font-size:20px}
.progress-card .ring .pct span{font-size:10px;opacity:.85}
.progress-card .info{flex:1}
.progress-card .info .title{font-size:16px;font-weight:700;margin-bottom:4px}
.progress-card .info .sub{font-size:13px;opacity:.85}

.task-list{display:flex;flex-direction:column;gap:10px}
.subj-group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.subj-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;background:linear-gradient(180deg,#fbfaff,#fff)}
.subj-head:hover{background:var(--purple-soft)}
.subj-tt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink)}
.subj-tt .caret{display:inline-block;transition:transform .15s;color:var(--purple);font-size:12px}
.subj-prog{display:flex;align-items:center;gap:10px}
.subj-count{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.subj-prog .bar{width:80px;height:7px;border-radius:6px;background:var(--line);overflow:hidden}
.subj-prog .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--purple),var(--purple-2));transition:width .25s}
.subj-body{padding:8px 12px 12px;border-top:1px solid var(--line)}
.task-item{display:flex;align-items:center;gap:12px;padding:14px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;transition:.15s}
.task-item:active{transform:scale(.995)}
.task-item.done{background:var(--green-soft);border-color:#bfe8d4}
.task-item.done .tt{text-decoration:line-through;color:var(--muted)}
.task-item .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:#fff;transition:.15s}
.task-item.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.task-item .body{flex:1;min-width:0}
.task-item .body .tt{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item .body .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.task-item .body .meta .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);font-weight:600}
.task-item .body .meta .tag.deadline{background:var(--amber-soft);color:#8a5a00}
.task-item .body .meta .tag.daily{background:var(--purple-soft);color:var(--purple)}
.task-item .body .meta .tag.once{background:var(--bg);color:var(--muted)}
.task-item .acts{display:flex;gap:6px;opacity:0;transition:.15s}
.task-item:hover .acts{opacity:1}
@media (max-width:768px){.task-item .acts{opacity:1}}
.task-item .acts button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--bg);border:none}
.task-item .acts button:hover{background:var(--red-soft);color:var(--red)}

.empty-state{text-align:center;padding:34px 20px;color:var(--muted)}
.empty-state p{margin:6px 0 0;font-size:13px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s;min-height:44px;border:none;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple-2));color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.25)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-sm{padding:7px 12px;font-size:13px;min-height:38px}
.btn-block{width:100%;justify-content:center}

.cta-add{width:100%;border:2px dashed #c9c2f5;background:var(--purple-soft);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--purple);font-size:15px;font-weight:600;transition:.2s;min-height:54px;background:none}
.cta-add:hover{background:#e6ddff;border-color:var(--purple)}

.frm-group{margin-bottom:14px}
.frm-group label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.frm-group input,.frm-group select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:16px}
.frm-group input:focus,.frm-group select:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,92,255,.12)}
.frm-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm-acts{display:flex;gap:10px;margin-top:6px}
.frm-acts .btn{flex:1}

.modal{position:fixed;inset:0;background:rgba(20,24,40,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
.modal.show{display:flex}
.modal-box{background:var(--card);border-radius:18px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90vh;overflow:auto}
.modal-box h3{margin:0 0 8px;font-size:17px}
.modal-box p{margin:0 0 16px;color:var(--muted);font-size:14px}
.modal-box .acts{display:flex;gap:10px}
.modal-box .acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#1d2130;color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mine-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mine-row:last-child{border:none}
.mine-row .ml{display:flex;align-items:center;gap:12px}
.mine-row .ml .ic{width:38px;height:38px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--purple)}
.mine-row .ml .t{font-weight:600}
.mine-row .ml .s{font-size:12px;color:var(--muted)}
.steps{background:var(--bg);border-radius:12px;padding:14px;margin-top:8px}
.steps ol{margin:0;padding-left:18px}
.steps li{margin-bottom:8px;font-size:13px}
.steps li:last-child{margin-bottom:0}

.mobile-tabbar{display:none}
@media (max-width:768px){
  .sidebar{display:none}
  .mobile-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:50;padding-bottom:var(--safe-bottom)}
  .mobile-tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:10.5px;color:var(--muted);min-height:54px;background:none;border:none}
  .mobile-tabbar button.active{color:var(--purple);font-weight:700}
  .main{padding:18px 16px calc(84px + var(--safe-bottom));max-width:none}
  .frm-row{grid-template-columns:1fr}
  .progress-card{flex-direction:column;text-align:center}
}
@media (min-width:769px) and (max-width:1024px){
  .sidebar{width:190px;flex-basis:190px}
}
@media (min-width:769px) and (max-width:1080px){
  .app{flex-direction:column}
  .sidebar{position:static;height:auto;width:100%;flex:0 0 auto;flex-direction:row;align-items:center;padding:14px 20px;border-right:none;border-bottom:1px solid var(--line)}
  .logo{padding:0 12px 0 0}
  .logo p{display:none}
  .nav{flex-direction:row;gap:8px;margin:0;flex:1;justify-content:flex-end}
  .nav button{padding:10px 14px;font-size:13px}
  .side-foot{display:none}
  .main{max-width:none}
}

/* ===== 同步状态指示器 ===== */
.sync-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:6px 14px;font-size:12px;color:var(--muted);margin-bottom:16px;width:fit-content}
.sync-bar .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.sync-bar.online .dot{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.sync-bar.syncing .dot{background:var(--amber);animation:syncpulse 1s infinite}
.sync-bar.offline .dot{background:var(--red)}
.sync-bar .st{font-weight:600}
@keyframes syncpulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-bar button{margin-left:4px;color:var(--purple);font-weight:600;font-size:12px;background:none;border:none;cursor:pointer}
</style>

<script>
const LS_KEY='wb_daily_checkin_v1';
const VERSION=1;
const TYPES={daily:{name:'每日任务',cls:'daily'},once:{name:'一次性',cls:'once'},deadline:{name:'截止任务',cls:'deadline'}};
const SUBJECTS=['数学','语文','英语','历史','化学','物理','生物','政治','地理','道法','其他'];
const UNCAT='未分类';
function subjOf(t){return t&&t.subject?t.subject:UNCAT}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayStr(){const d=new Date();return fmtDate(d)}
function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`}
function parseDate(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d)}
function prettyDate(s){const p=s.split('-');return `${+p[1]}月${+p[2]}日`}
function weekday(s){const d=parseDate(s);return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}
function isToday(s){return s===todayStr()}
function normalize(s){s=s||{};if(!s.version)s.version=VERSION;if(!Array.isArray(s.tasks))s.tasks=[];else s.tasks.forEach(t=>{if(!t.subject)t.subject=UNCAT});if(!Array.isArray(s.logs))s.logs=[];if(!s.logMeta)s.logMeta={};return s}

function defaultTasks(){
  return [
    {id:uid(),name:'学校数学错题改完讲发（陈）',type:'daily',subject:'数学'},
    {id:uid(),name:'历史1套卷子➕更正',type:'daily',subject:'历史'},
    {id:uid(),name:'语文1套卷子➕更正',type:'daily',subject:'语文'},

    {id:uid(),name:'英语学校作业对答案改错',type:'daily',subject:'英语'},
    {id:uid(),name:'化学在线课',type:'daily',subject:'化学'},
    {id:uid(),name:'数学教材9年级和高一',type:'daily',subject:'数学'},
    {id:uid(),name:'朱老师：看群错题/测试解析、黄皮书、蓝冲、小蓝本',type:'daily',subject:'数学'},

    {id:uid(),name:'郭语文：改红冲、改作文➕新作文反馈',type:'once',subject:'语文'},
    {id:uid(),name:'搜语文名著题练习（蓝冲）',type:'once',subject:'语文'},
  ];
}
function buildSeed(){const s=normalize({});s.tasks=defaultTasks();s.logs=seedLogs();return s}
function seedLogs(){
  const t=todayStr();
  const logs=[];
  const ids=S.tasks.map(x=>x.id);
  // 过去6天，每天随机完成60%任务，制造示例历史
  for(let i=6;i>=1;i--){
    const d=addDays(t,-i);
    S.tasks.forEach((task,idx)=>{
      if((idx+i)%3!==0) logs.push({id:uid(),tid:task.id,date:d,ts:Date.now()-i*86400000});
    });
  }
  // 今天完成前5个
  S.tasks.slice(0,5).forEach(task=>{logs.push({id:uid(),tid:task.id,date:t,ts:Date.now()})});
  return logs;
}

function load(){
  let st=null;
  try{const raw=localStorage.getItem(LS_KEY);if(raw){st=JSON.parse(raw);st=normalize(st)}}catch(e){st=null}
  if(st&&st.tasks&&st.tasks.length)return st;
  return buildSeed();
}
function save(){
  S=normalize(S);
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  scheduleCloudPush();
}

/* 重新生成 seed logs 需要 S.tasks 已存在，所以调整 buildSeed 避免循环依赖 */
function buildSeedSafe(){
  const s=normalize({});
  s.tasks=defaultTasks();
  const t=todayStr();
  s.tasks.forEach((task,idx)=>{
    for(let i=6;i>=1;i--){
      const d=addDays(t,-i);
      if((idx+i)%3!==0) s.logs.push({id:uid(),tid:task.id,date:d,ts:Date.now()-i*86400000});
    }
  });
  s.tasks.slice(0,5).forEach(task=>{s.logs.push({id:uid(),tid:task.id,date:t,ts:Date.now()})});
  return s;
}

function tasksBySubject(){const m={};S.tasks.forEach(t=>{const k=subjOf(t);(m[k]=m[k]||[]).push(t)});return m}
const SUBJECT_KEYWORDS={
  '数学':['数学','小蓝本','黄皮书','蓝冲','方程','几何','代数','函数','错题'],
  '语文':['语文','名著','古文','作文','红冲','阅读'],
  '英语':['英语','百词斩','语法','单词','english'],
  '历史':['历史'],
  '化学':['化学'],
  '物理':['物理'],
  '生物':['生物'],
  '政治':['政治'],
  '地理':['地理'],
  '道法':['道法'],
};
function smartGuessSubject(name){
  for(const subj in SUBJECT_KEYWORDS){
    for(const kw of SUBJECT_KEYWORDS[subj]){
      if(name&&name.indexOf(kw)>=0)return subj;
    }
  }
  return null;
}
function smartClassify(){
  let changed=0,already=0,failed=0;
  const failedList=[];
  S.tasks.forEach(t=>{
    if(t.subject&&t.subject!==UNCAT){already++;return}
    const guess=smartGuessSubject(t.name);
    if(guess){t.subject=guess;changed++}
    else{failed++;failedList.push(t.name)}
  });
  S=normalize(S);
  save();
  const msg=`已自动归类 ${changed} 项，已分类 ${already} 项${failed?`，无法识别 ${failed} 项`:''}`;
  if(failedList.length){
    showModal('智能补科完成',
      msg+'<br><br><div style="font-size:13px;color:var(--muted);max-height:180px;overflow:auto;background:var(--bg);padding:10px;border-radius:8px">无法识别的任务：<br>'+failedList.map(n=>'• '+esc(n)).join('<br>')+'</div><p style="font-size:12px;color:var(--muted);margin-top:10px">提示：点击任务右侧✏️手动选科目</p>',
      [{label:'好的',cls:'btn-primary',fn:()=>{closeModal();render()}}]
    );
  }else{
    toast(msg);
    render();
  }
}
function subjMeta(t){
  const meta=[];
  const typeInfo=TYPES[t.type]||TYPES.daily;
  meta.push(`<span class="tag ${typeInfo.cls}">${typeInfo.name}</span>`);
  if(t.deadline){
    const d=parseDate(t.deadline),now=parseDate(todayStr());
    const diff=Math.round((d-now)/86400000);
    const cls=diff<0?'deadline':diff<=2?'deadline':'';
    meta.push(`<span class="tag ${cls}">${diff<0?`逾期${-diff}天`:diff===0?'今天截止':`剩${diff}天`}</span>`);
  }
  return meta;
}

    {label:'保存',cls:'btn-primary',fn:saveTask}

  const sel=$('tf_type');if(sel)sel.onchange=()=>{const g=$('tf_deadline_group');if(g)g.style.display=sel.value==='deadline'?'block':'none';};

function saveTask(){
  const name=$('tf_name').value.trim(),type=$('tf_type').value,deadline=$('tf_deadline')?$('tf_deadline').value:'',subject=$('tf_subject').value||UNCAT;
  if(!name){toast('请输入任务名称');return}
  if(editTaskId){
    const t=S.tasks.find(x=>x.id===editTaskId);if(t){t.name=name;t.type=type;t.subject=subject;t.deadline=type==='deadline'?deadline:'';}
  }else{
    S.tasks.push({id:uid(),name,type,subject,deadline:type==='deadline'?deadline:''});
  }
  save();closeModal();render();toast('已保存');
}

  inp.click();
}

function doClearAll(){
  const v=$('clearConfirm')&&$('clearConfirm').value.trim();

  S=normalize({});save();closeModal();render();toast('已清空全部数据')
}

const CLOUD_ROW_ID=1;
let cloudOnline=false;      // 是否在线
let cloudPulling=false;     // 是否正在拉取
let cloudDirty=false;       // 本地有未推送的修改
let pushTimer=null;

function setSyncStatus(mode){
  const bar=$('syncBar'),txt=$('syncText');
  if(!bar)return;
  bar.className='sync-bar '+mode;
  const btnBox=$('syncBtnBox');
  if(mode==='online'){txt.textContent='已同步 · 多设备实时同步中';btnBox.innerHTML='<button onclick="cloudPull(true)">刷新</button>';}
  else if(mode==='syncing'){txt.textContent='正在同步…';btnBox.innerHTML='';}
  else if(mode==='offline'){txt.textContent='离线模式（断网，数据已暂存本地）';btnBox.innerHTML='<button onclick="cloudPull(true)">重连</button>';}
  else{txt.textContent='正在连接云端…';btnBox.innerHTML='';}
}
async function supaFetch(path,opts){
  const o=opts||{};
  const res=await fetch(SUPA_URL+'/rest/v1/'+path,{
    method:o.method||'GET',
    headers:{
      'apikey':SUPA_KEY,
      'Authorization':'Bearer '+SUPA_KEY,
      'Content-Type':'application/json',
      'Prefer':o.prefer||'return=minimal'
    },
    body:o.body?JSON.stringify(o.body):undefined
  });
  if(!res.ok)throw new Error('HTTP '+res.status);
  const ct=res.headers.get('content-type')||'';
  if(ct.includes('application/json')&&res.status!==204){return await res.json()}
  return null;
}
/* 从云端拉取整份数据 */
async function cloudPull(manual){
  if(cloudPulling)return;
  cloudPulling=true;
  if(!manual)setSyncStatus('syncing');
  try{
    const rows=await supaFetch('checkins?id=eq.'+CLOUD_ROW_ID+'&select=data,updated_at');
    if(rows&&rows.length){
      const cloudData=rows[0].data;
      const cloudTs=(rows[0].updated_at?Date.parse(rows[0].updated_at):0);
      const localTs=S.updatedAt||0;
      if(cloudTs>localTs){
        /* 云端较新 → 以云端为准 */
        S=normalize(cloudData);
        try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
        currentTab='today';currentDate=todayStr();
        cloudOnline=true;cloudDirty=false;
        render();setSyncStatus('online');
        if(manual)toast('已从云端同步最新数据');
      }else{
        cloudOnline=true;
        setSyncStatus('online');
        /* 本地较新 → 推送云端 */
        if(cloudDirty||localTs>cloudTs){await cloudPush()}
        else if(manual){render();setSyncStatus('online');toast('已是最新')}
      }
    }else{
      /* 云端还没有数据行 → 推送当前 */
      cloudOnline=true;
      await cloudPush();
    }
  }catch(e){
    cloudOnline=false;setSyncStatus('offline');
    if(manual)toast('连接云端失败，请检查网络');
  }
  cloudPulling=false;
}
/* 推送整份数据到云端（UPSERT：行存在则更新，不存在则插入） */
async function cloudPush(){
  try{
    const body={id:CLOUD_ROW_ID,data:S,updated_at:new Date().toISOString()};
    await supaFetch('checkins',{
      method:'POST',
      body:body,
      prefer:'resolution=merge-duplicates'
    });
    cloudOnline=true;cloudDirty=false;
    setSyncStatus('online');
  }catch(e){
    cloudOnline=false;cloudDirty=true;
    setSyncStatus('offline');
  }
}
/* 防抖推送 */
function scheduleCloudPush(){
  if(!cloudOnline&&!navigator.onLine)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>cloudPush(),600);
}
/* 在线状态监听 */
window.addEventListener('online',()=>{cloudPull(true)});
window.addEventListener('offline',()=>{setSyncStatus('offline')});

render();
/* 页面加载后拉取云端（本地先秒开，再后台同步） */
window.addEventListener('load',()=>{cloudPull(false)});
setTimeout(()=>{if(!cloudOnline)cloudPull(false)},1500);
window.addEventListener('focus',()=>{const d=new Date().getDate();if(window.__day!==undefined&&window.__day!==d){window.__day=d;currentDate=todayStr();render()}else window.__day=d});
